name: BetterMinecraft
version: '${version}'

main: ch.framedev.betterminecraft.main.BetterMinecraft
api-version: '26.1'

commands:
  sethome:
    description: Set a home location
  home:
    description: Teleport to your home location
  delhome:
    description: Delete a home location
  homes:
    description: List your home locations
  tpa:
    description: Request a teleport
  tpaaccept:
    description: Accept a teleport request
  tpadeny:
    description: Deny a teleport request
  tpahere:
    description: Request a teleport to your location
  tpahereaccept:
    description: Accept a teleport request to your location
  tpaheredeny:
    description: Deny a teleport request to your location
  warp:
    description: Teleport to a warp location
  setwarp:
    description: Set a warp location
  delwarp:
    description: Delete a warp location
  heal:
    description: Heal yourself or another player
  feed:
    description: Feed yourself or another player
  crafthistory:
    description: View your crafting history