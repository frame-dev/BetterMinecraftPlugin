  gui:
    title: "&aCrafting History &f%player% &7(%page%/%pages%)"
    recipe: "&7Recipe: &f%recipe%"
    amount: "&7Total crafted: &a%amount%x"
    last-crafted: "&7Last crafted: &e%date%"
    previous-page: "&ePrevious Page"
    next-page: "&eNext Page"
    page: "&7Page &f%page%"
    close: "&cClose"
    close-hint: "&7Click to close."
    filter: "&eSort / Filter"
    current: "&7Current:"
    filter-hint: "&eClick to change"
    selected-newest: "&aLast Crafted: Newest"
    newest: "Last Crafted: Newest"
    selected-oldest: "&aLast Crafted: Oldest"
    oldest: "Last Crafted: Oldest"
    selected-highest: "&aAmount: Highest"
    highest: "Amount: Highest"
    selected-lowest: "&aAmount: Lowest"
    lowest: "Amount: Lowest"
    filter-selected: "&a➤ %filter%"
    filter-unselected: "&7  %filter%"

betterminecraft:
  version: "&aBetterMinecraft plugin version: &6%version%"
  author: "&aAuthor: &6%authors%"
  website: "&aWebsite: &6%website%"
  reload-hint: "&aUse /betterminecraft reload to reload the plugin."
  reloaded: "&aBetterMinecraft plugin reloaded."
  no-commands: "&cNo commands available."
  commands-header: "&aAvailable commands:"
  help:
    reload: "&a/betterminecraft reload - Reloads the plugin."
    help: "&a/betterminecraft help - Shows this help message."
    version: "&a/betterminecraft version - Shows the plugin version."
    info: "&a/betterminecraft info - Shows plugin information."
    commands: "&a/betterminecraft commands - Shows all available commands."
  command-entry: "&6/%command%"
  command-entry-description: "&6/%command% &8- &f%description%"
  command-permission: "&8  ├ &7Permission: &f%permission%"
  command-aliases: "&8  ├ &7Aliases: &f/%aliases%"
  command-usage: "&8  └ &7Usage: &f%usage%"

chatclear:
  usage: "&eUsage: &7/chatclear"
  cleared: "&aChat has been cleared by &6%player%&a."

warn:
  before-tool-break: "&cYour tool is about to break!"
